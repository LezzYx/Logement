name: Crous Watcher

on:
  workflow_dispatch: {}      # déclenché par cron-job.org toutes les 5 minutes
  # Le trigger "schedule" interne a été retiré : il faisait doublon avec
  # cron-job.org (deux sources déclenchaient le même workflow en parallèle),
  # ce qui pouvait saturer les runners gratuits GitHub et provoquer des
  # erreurs "job not acquired".

concurrency:
  group: crous-watcher
  cancel-in-progress: false  # on ne coupe pas un run en cours, on met juste
                              # en attente le suivant plutôt que de les
                              # laisser tourner en parallèle

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3        # évite qu'un run bloqué reste "en cours"
                               # indéfiniment et bloque toute la file
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run watcher
        id: run-watcher
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python crous_watcher.py
        continue-on-error: true

      - name: Commit updated state files
        run: |
          git config user.name "crous-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json status.json
          git diff --quiet --cached || git commit -m "update state"

          # Retry en cas de conflit de push (deux runs proches dans le temps) :
          # on récupère les derniers changements distants et on rejoue notre
          # commit par-dessus avant de retenter, jusqu'à 5 fois.
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejeté (tentative $i/5), on retente après rebase..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done

      - name: Fail the job if the watcher failed
        if: steps.run-watcher.outcome == 'failure'
        run: exit 1

      - name: Alert Discord on any job failure
        if: failure()   # se déclenche même si le script n'a jamais démarré
                         # (ex: "job not acquired", erreur de checkout, etc.)
        run: |
          curl -sf -X POST -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "⚠️ Crous Watcher : le job a échoué avant/pendant l'\''exécution",
                "description": "Panne au niveau GitHub Actions (runner non attribué, étape en échec...), indépendante du script. Voir les logs du run pour le détail.",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": 15548997
              }]
            }' \
            "${{ secrets.DISCORD_WEBHOOK }}" || true
